name: Bug report
description: Report reproducible behaviour that looks wrong.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: In Damdit, Settings → About & Support → Report a Bug… fills in the version and system for you.
  - type: input
    id: version
    attributes:
      label: Damdit version
      description: Settings → About & Support, e.g. 1.0.0 (build).
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: e.g. macOS 15.4, Windows 11 24H2, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a public or synthetic example. Do not attach a private audit report.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic information (optional)
      description: Settings → About & Support → Copy Diagnostic Information (versions, licence state, latest audit status). It never contains website addresses, project names, content, access keys or account details.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included credentials, private audit reports, or personal data.
          required: true
